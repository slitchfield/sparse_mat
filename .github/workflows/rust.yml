on: [push, pull_request]

name: CI

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: ./check.sh

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-version in Cargo.toml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.87"
      - uses: Swatinem/rust-cache@v2
      # Build and test only: lints and formatting are checked on stable by the Check job
      - run: cargo test --workspace --all-targets --all-features

  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # RustSec advisories, licenses, banned crates and sources, configured in deny.toml.
      #   Advisories can appear without any change here, so this job can start failing on
      #   an unchanged branch; that is the point of running it.
      - uses: EmbarkStudios/cargo-deny-action@v2
