on: [push, pull_request]

name: CI

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # MATPOWER's case files aren't committed, so fetch the pinned release. The cache key
      #   hashes the fetch script, which holds the version and its SHA-256, so bumping either
      #   fetches afresh. On a cache hit the script finds its .ybus-verified marker and exits.
      - uses: actions/cache@v4
        with:
          path: testdata/matpower
          key: matpower-${{ hashFiles('scripts/fetch-matpower.sh') }}
      - run: scripts/fetch-matpower.sh
      - run: ./check.sh
        env:
          # Fail, rather than skip, any test whose MATPOWER case is missing
          YBUS_REQUIRE_CASES: "1"

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-version in the root Cargo.toml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.87"
      - uses: Swatinem/rust-cache@v2
      # Build and test only: lints and formatting are checked on stable by the Check job.
      #   MATPOWER isn't fetched here, so tests that need its cases skip; the Check job runs
      #   them with the cases required.
      - run: cargo test --workspace --all-targets --all-features

  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # RustSec advisories, licenses, banned crates and sources, configured in deny.toml.
      #   Advisories can appear without any change here, so this job can start failing on
      #   an unchanged branch; that is the point of running it.
      - uses: EmbarkStudios/cargo-deny-action@v2
