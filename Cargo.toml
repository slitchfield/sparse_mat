[package]
name = "sparse_mat"
version = "0.1.0"
edition = "2021"

[features]
# Serialize and deserialize matrices as a shape plus a list of (row, col, value) entries
serde = ["dep:serde"]
# Parallel versions of the heavier products, prefixed `par_`
rayon = ["dep:rayon"]

[dependencies]
num-traits = "0.2"
serde = { version = "1", optional = true, features = ["derive"] }
rayon = { version = "1", optional = true }

[dev-dependencies]
num-complex = "0.4"
serde_json = "1"
